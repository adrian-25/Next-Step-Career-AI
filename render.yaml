services:
  # Public FastAPI service. Its URL is injected into the frontend build below.
  - type: web
    name: next-step-career-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          name: next-step-career-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # Vite creates a client-side React application, so it is served from Render's CDN.
  - type: web
    name: next-step-career-ai
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PREMIUM_UI
        value: "true"
      - key: VITE_API_URL
        fromService:
          name: next-step-career-ai-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
